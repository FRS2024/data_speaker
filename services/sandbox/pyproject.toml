[project]
name = "sandbox-runner"
version = "0.1.0"
description = "Stateful Isolated IPython Execution Sandbox for data_speaker"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "ipython>=8.24.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "pyarrow>=16.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "plotly>=5.22.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
