[project]
name = "data-speaker"
version = "0.1.0"
description = "Conversational Data Analysis Platform"
readme = "project_overview.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "sqlmodel>=0.0.18",
    "chardet>=5.2.0",
    "tabulate>=0.9.0",
    "openpyxl>=3.1.2",
    "polars>=0.20.0",
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[tool.uv.workspace]
members = [
    "services/sandbox",
    "services/api",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
